<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ending Credits</title>
<meta name="description" content="Guess the anime opening or ending from a one-second clip. A daily puzzle, an endless mode with three lives, and live rooms for up to 8 friends.">
<meta property="og:title" content="Ending Credits">
<meta property="og:description" content="Guess the anime opening or ending from a one-second clip.">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<script>try{var t=localStorage.getItem('ec.theme');if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
</head>
<body>
<header class="top">
  <a class="mark" href="#/daily">Ending <em>Credits</em></a>
  <nav class="tabs" aria-label="Modes">
    <a href="#/daily" data-tab="daily">Daily</a>
    <a href="#/endless" data-tab="endless">Endless</a>
    <a href="#/rooms" data-tab="rooms">Rooms</a>
  </nav>
  <div class="tools">
    <label class="vol" title="Volume">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="vol" type="range" min="0" max="1" step="0.05" aria-label="Volume">
    </label>
    <button id="theme" class="icon" aria-label="Switch light or dark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 4.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/></svg>
    </button>
    <button id="help" class="icon" aria-label="How to play">?</button>
  </div>
</header>
<main id="view"></main>
<footer class="foot">Clips are official Apple Music previews · Made by Virat Reddy Kaukuntla · <a href="https://rennko.tech">Rennko</a></footer>
<dialog id="dlg"></dialog>
<script type="module" src="/js/app.js"></script>
</body>
</html>
